name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject tracked secret files
        shell: bash
        run: |
          tracked_secret_files="$({ git ls-files | grep -E '(^|/)(\.env($|\.)|\.dev\.vars($|\.))|(\.pem|\.key|\.p12|\.pfx)$' | grep -vE '(\.env\.example|\.dev\.vars\.example)$'; } || true)"
          if [[ -n "$tracked_secret_files" ]]; then
            echo "Secret-bearing paths must not be tracked:"
            echo "$tracked_secret_files"
            exit 1
          fi

      - name: Verify generated template
        run: pnpm template:check

      - name: Scan tracked files for secrets
        run: pnpm security:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run essential tests
        run: pnpm test

      - name: Build production Worker
        run: pnpm build

      - name: Check portal JavaScript budget
        run: node scripts/check-bundle.mjs

      - name: Verify packed packages and clean generated installation
        run: pnpm packages:check

      - name: Verify documentation deployment bundle
        run: pnpm deploy:docs:dry-run

      - name: Verify Worker deployment bundle
        run: pnpm deploy:dry-run
