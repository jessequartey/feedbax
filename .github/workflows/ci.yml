name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/create-feedbax/package-lock.json
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - run: npm ci --prefix packages/create-feedbax # the CLI package has its own install
      # The packed-CLI test (create-feedbax + feedbax) is network-bound (it installs and builds a generated app), so it runs
      # alongside the CPU-bound steps below and is joined in the last step. PR CI installs and
      # builds the generated app with npm only; release.yml sets FULL_PM_MATRIX=1 for npm/pnpm/bun.
      - name: Start packed-CLI test in the background
        run: |
          setsid nohup bash -c '
            npm install -g pnpm@10.29.3 &&
            npm install -g bun@1.3.9 --allow-scripts=bun && # Bun needs its postinstall under npm 12
            npm run test:package
            echo $? > "$RUNNER_TEMP/package.exit"
          ' > "$RUNNER_TEMP/package.log" 2>&1 < /dev/null &
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Worker exports fetch, queue and scheduled
        run: npm run verify:build
      - name: Built Worker request boundaries
        run: node scripts/test-worker-entry.ts
      - name: Built Worker auth and session isolation
        run: node scripts/test-worker-auth.ts
      - name: Built Worker provider sync
        run: node scripts/test-worker-sync.ts
      - name: Wrangler dry run
        run: npx --no-install wrangler deploy --dry-run
      - name: No server secret names in the portal client bundle (the public registry JSON in dist/client/r documents them)
        run: |
          if grep -rE --exclude-dir=r 'BETTER_AUTH_SECRET|FEEDBAX_HOST_SECRET' dist/client; then
            echo "Server secret name found in dist/client." >&2
            exit 1
          fi
      - name: Registry is up to date
        run: |
          npm run registry:build
          git diff --exit-code -- public/r
      - name: Packed CLI test result (npm run test:package)
        run: |
          for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/package.exit" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/package.log"
          [ "$(cat "$RUNNER_TEMP/package.exit" 2>/dev/null)" = 0 ]
      - name: Scan for secrets
        run: |
          if git grep -nE '(ntn_[A-Za-z0-9]{20,}|secret_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!package-lock.json' ':!tests/fixtures'; then
            echo "Possible secret committed." >&2
            exit 1
          fi
