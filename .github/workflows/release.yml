name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish or retry
        required: true
        type: string

permissions:
  contents: write # GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/create-feedbax/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.2 pnpm@10.29.3
      - run: npm install -g bun@1.3.9 --allow-scripts=bun # Bun's installer needs its postinstall under npm 12

      - name: Tag matches both CLI versions
        run: |
          for name in create-feedbax feedbax; do
            pkg=$(node -p "require('./packages/$name/package.json').version")
            if [ "v$pkg" != "$RELEASE_TAG" ]; then
              echo "Tag $RELEASE_TAG does not match packages/$name version $pkg" >&2
              exit 1
            fi
          done

      - name: Notion template URL is real and matches the README
        run: |
          url=$(node --input-type=module -e 'import { NOTION_TEMPLATE_URL } from "./packages/create-feedbax/src/links.ts"; console.log(NOTION_TEMPLATE_URL)')
          if echo "$url" | grep -qiE 'placeholder|example\.com|TODO|REPLACE|XXXX'; then
            echo "NOTION_TEMPLATE_URL is still a placeholder: $url" >&2
            exit 1
          fi
          if ! grep -qF "($url)" README.md; then
            echo "README.md must link the Notion template as ($url)" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm ci --prefix packages/create-feedbax # the CLI package has its own install
      # The tag points at a main commit that CI already verified (check, typecheck, tests, built
      # Worker scripts, wrangler dry run, registry diff); only release-specific work repeats here.
      - run: npm run build
      - run: npm run cli:build
      - run: npm run test:package
        env:
          FULL_PM_MATRIX: "1"

      - name: Pack the CLIs
        run: |
          npm pack ./packages/create-feedbax ./packages/feedbax --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum create-feedbax-*.tgz feedbax-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Each package is published (or its existing upload verified) independently, so a retry
      # after a partial failure finishes the release instead of republishing.
      - name: Publish to npm
        run: |
          for name in create-feedbax feedbax; do
            version=$(node -p "require('./packages/$name/package.json').version")
            tarball="$RUNNER_TEMP/$name-$version.tgz"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              published=$(npm view "$name@$version" dist.integrity)
              expected=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { createHash } from "node:crypto"; console.log("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "$tarball")
              if [ "$published" != "$expected" ]; then
                echo "$name@$version is already on npm with different package contents; refusing to create a release." >&2
                exit 1
              fi
              echo "$name@$version is already on npm with matching integrity; skipping publish."
            else
              npm publish "$tarball" --access public --provenance
            fi
          done

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Install: \`npx create-feedbax@${RELEASE_TAG#v}\`" \
            "Upgrade an existing 0.3.0+ project: \`npx feedbax@${RELEASE_TAG#v} migrate\`" \
            "" \
            "Full setup guide: see the README. Starting from 0.2.x? Create a new project (see CHANGELOG.md)." \
            > "$RUNNER_TEMP/notes-header.md"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes-header.md" \
            "$RUNNER_TEMP"/create-feedbax-*.tgz \
            "$RUNNER_TEMP"/feedbax-*.tgz \
            "$RUNNER_TEMP/SHA256SUMS.txt"
